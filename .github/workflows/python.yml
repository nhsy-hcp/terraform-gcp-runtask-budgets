name: "Python"

on:
  pull_request:
  push:

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud_functions/tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "cloud_functions/tests/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests marked gcp call real Google APIs and need credentials;
      # coverage minimum is set in cloud_functions/tests/.coveragerc
      - name: Pytest
        run: pytest -v --tb=short -m "not gcp" --cov --cov-report=term-missing
