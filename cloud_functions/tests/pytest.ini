[pytest]
env =
    DISABLE_GOOGLE_LOGGING=1
    HMAC_KEY=secret
    LOG_LEVEL=INFO
    RUNTASK_PROJECT=example-runtask-project
    RUNTASK_REGION=europe-west1
    RUNTASK_WORKFLOW=runtask-workflow
markers =
    gcp: calls real Google Cloud APIs (needs ADC and a default project)
filterwarnings =
    ignore::DeprecationWarning
